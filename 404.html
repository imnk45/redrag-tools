<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | REDRAG Tools</title>
  <meta name="description" content="The page you are looking for does not exist. Explore REDRAG's free gaming tools and PC calculators.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://tools.redrag.in/404.html">

  <!-- Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <!-- Shared CSS -->
  <link rel="stylesheet" href="/shared/css/core.css?v=33">
  <link rel="stylesheet" href="/shared/css/components.css?v=45">
  <link rel="stylesheet" href="/shared/css/shell.css?v=33">

  <style>
    .rt-error-page {
      min-height: 70vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: var(--rt-space-10) var(--rt-space-5);
      position: relative;
    }
    .rt-error-page__code {
      font-size: clamp(80px, 15vw, 160px);
      font-weight: var(--rt-weight-black);
      line-height: 1;
      background: linear-gradient(135deg, var(--rt-primary), var(--rt-primary-light));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      letter-spacing: -4px;
      margin-bottom: var(--rt-space-4);
    }
    .rt-error-page__title {
      font-size: var(--rt-text-h2);
      margin-bottom: var(--rt-space-3);
    }
    .rt-error-page__desc {
      font-size: var(--rt-text-body-lg);
      max-width: 480px;
      margin-bottom: var(--rt-space-6);
    }
    .rt-error-page__actions {
      display: flex;
      gap: var(--rt-space-3);
      flex-wrap: wrap;
      justify-content: center;
    }
    .rt-error-page__suggestions {
      margin-top: var(--rt-space-8);
      width: 100%;
      max-width: 600px;
    }
    .rt-error-page__suggestions h3 {
      font-size: var(--rt-text-h4);
      margin-bottom: var(--rt-space-4);
      color: var(--rt-text-secondary);
    }
  </style>
</head>
<body>

  <!-- Header placeholder -->
  <div id="rt-header" data-active="tools"></div>

  <main id="rt-main">
    <div class="rt-container">
      <div class="rt-error-page">
        <div class="rt-error-page__code">404</div>
        <h1 class="rt-error-page__title">Page Not Found</h1>
        <p class="rt-error-page__desc">
          The page you are looking for doesn't exist or has been moved.
          Check out our free gaming tools below.
        </p>
        <div class="rt-error-page__actions">
          <a href="/" class="rt-btn rt-btn--primary">ðŸ  Back to Tools Hub</a>
          <a href="https://www.redrag.in/" class="rt-btn rt-btn--secondary">ðŸ“° Visit Blog</a>
        </div>

        <div class="rt-error-page__suggestions">
          <h3>Popular Tools</h3>
          <div class="rt-tools-grid" id="popular-tools">
            <!-- Populated by JS -->
            <div class="rt-card rt-card--skeleton" style="height:120px;"></div>
            <div class="rt-card rt-card--skeleton" style="height:120px;"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <!-- Footer placeholder -->
  <div id="rt-footer"></div>

  <!-- Shared JS -->
  <script src="/shared/js/core.js?v=33"></script>
  <script src="/shared/js/components.js?v=33"></script>
  <script src="/shared/js/seo.js?v=33"></script>

  <script>
    // Load popular tools from registry
    (async function() {
      try {
        const res = await fetch('/shared/data/tools-registry.json');
        const data = await res.json();
        const liveTools = data.tools.filter(t => t.status === 'live').slice(0, 3);
        const container = document.getElementById('popular-tools');

        if (liveTools.length && container) {
          container.innerHTML = liveTools.map(tool => `
            <a href="/${tool.slug}/" class="rt-card rt-card--hover rt-card--accent-top" style="text-decoration:none;color:inherit;">
              <div style="font-size:32px;margin-bottom:12px;">${tool.icon}</div>
              <h4 style="font-size:18px;font-weight:800;margin-bottom:8px;">${RT.utils.escapeHtml(tool.name)}</h4>
              <p style="font-size:14px;color:var(--rt-text-secondary);line-height:1.6;">${RT.utils.escapeHtml(tool.description)}</p>
              <div style="margin-top:12px;">
                <span class="rt-tag rt-tag--live">â— LIVE</span>
              </div>
            </a>
          `).join('');
        }
      } catch (e) {
        console.error('Failed to load tools:', e);
      }
    })();
  </script>

</body>
</html>
